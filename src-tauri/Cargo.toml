[package]
name = "screen-shot"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["clipboard-write-text", "global-shortcut-all", "shell-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
screenshots = "0.8"
image = "0.24"
base64 = "0.21"

[features]
custom-protocol = ["tauri/custom-protocol"]
